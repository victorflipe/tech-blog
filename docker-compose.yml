
services:
  db:
    image: postgres:16-alpine
    container_name: techblog_db
    env_file:
      - backend/.env
    ports:
      # Host 5434 evita conflito se já houver Postgres em 5432. Ajuste para "5432:5432" se a porta estiver livre.
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techblog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techblog_api
    env_file:
      - backend/.env
    environment:
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "scripts/start-api.sh"]
    volumes:
      - ./backend:/backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techblog_frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  db_data:
    driver: local